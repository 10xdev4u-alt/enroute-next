name: release

on:
  workflow_dispatch:
    inputs:
      overwrite:
        description: Publish over a version that is already published
        type: boolean
        default: false

concurrency:
  group: release-image-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  RELEASE_IMAGE: ghcr.io/enroute-sh/enroute
  CHANNELS: main

jobs:
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the branch is a channel
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          for channel in ${CHANNELS}; do
            if [ "${channel}" = "${BRANCH}" ]; then
              exit 0
            fi
          done
          echo "::error::${BRANCH} is not a release channel (${CHANNELS})."
          exit 1

      - name: Read the version
        id: read
        run: |
          version="$(awk '
            /^\[workspace\.package\]/ { in_table = 1; next }
            /^\[/                     { in_table = 0 }
            in_table && /^version[[:space:]]*=/ {
              gsub(/^version[[:space:]]*=[[:space:]]*"|"[[:space:]]*$/, "")
              print
              exit
            }
          ' Cargo.toml)"
          test -n "${version}"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"

      - name: Check the version is not a pre-release
        env:
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          case "${VERSION}" in
            *-*)
              echo "::error::${VERSION} is a pre-release, which ${CHANNELS} does not publish."
              exit 1
              ;;
          esac

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the version is unpublished
        env:
          VERSION: ${{ steps.read.outputs.version }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            if [ "${OVERWRITE}" = "true" ]; then
              echo "::warning::${IMAGE}:${VERSION} is published, and this run overwrites it."
            else
              echo "::error::${IMAGE}:${VERSION} is published. Bump the version, or run with overwrite."
              exit 1
            fi
          fi

      - name: Check the skill starts this release
        env:
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          for page in skills/build-on-enroute/SKILL.md skills/build-on-enroute/references/local-stack.md; do
            if ! grep -q "${RELEASE_IMAGE}:${VERSION} dev" "${page}"; then
              echo "::error::${page} does not start ${VERSION}: an installed skill would start the wrong Enroute."
              grep -n "${RELEASE_IMAGE}:" "${page}" || true
              exit 1
            fi
          done

  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - run: rustup toolchain install

      # The pinned checkers, from the one place their versions live.
      - run: cargo xtask ci tools

      # The same checks `ci.yml` names, named the same way: a release is gated
      # on what a pull request was gated on, so the two lists cannot drift.
      - run: cargo xtask ci fmt clippy lint

  linux:
    needs: [version, lint]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - run: python3 -m pip install ziglang==0.17.0

      - run: cargo install cargo-zigbuild --version 0.23.4 --locked

      - run: cargo zigbuild --release --locked -p enroute --bin enroute --target ${{ matrix.target }}.2.28

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/enroute
          if-no-files-found: error
          retention-days: 1

  macos:
    needs: [version, lint]
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - run: cargo build --release --locked -p enroute --bin enroute

      - uses: actions/upload-artifact@v7
        with:
          name: binary-aarch64-apple-darwin
          path: target/release/enroute
          if-no-files-found: error
          retention-days: 1

  image:
    needs: [version, linux]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: binary-${{ matrix.target }}
          path: ${{ runner.temp }}/binary

      - name: Write the image context
        run: |
          mkdir -p "${RUNNER_TEMP}/image"
          install -m 755 "${RUNNER_TEMP}/binary/enroute" "${RUNNER_TEMP}/image/enroute"
          cp -R proto "${RUNNER_TEMP}/image/proto"
          cat >"${RUNNER_TEMP}/image/Dockerfile" <<'EOF'
          FROM debian:bookworm-slim
          RUN apt-get update \
              && apt-get install -y --no-install-recommends ca-certificates \
              && rm -rf /var/lib/apt/lists/*
          ARG ENROUTE_COMMIT
          ARG ENROUTE_VERSION
          LABEL org.opencontainers.image.title="enroute" \
                org.opencontainers.image.description="The headless Git platform." \
                org.opencontainers.image.source="https://github.com/enroute-sh/enroute" \
                org.opencontainers.image.licenses="Apache-2.0" \
                org.opencontainers.image.revision="${ENROUTE_COMMIT}" \
                org.opencontainers.image.version="${ENROUTE_VERSION}"
          COPY enroute /usr/local/bin/enroute
          COPY proto /usr/share/enroute/proto
          VOLUME /var/lib/enroute
          EXPOSE 8080 50051 7400
          ENTRYPOINT ["/usr/local/bin/enroute"]
          EOF

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/image
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          build-args: |
            ENROUTE_COMMIT=${{ github.sha }}
            ENROUTE_VERSION=${{ needs.version.outputs.version }}

      - name: Hand the digest on
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [version, image]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join the images and tag them
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:sha-${GITHUB_SHA}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Say what it holds
        run: docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA}"

  archives:
    needs: [version, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/binaries
          pattern: binary-*

      - name: Pack the archives
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p "${RUNNER_TEMP}/dist"
          for binary in "${RUNNER_TEMP}"/binaries/binary-*/enroute; do
            target="$(basename "$(dirname "${binary}")")"
            name="enroute-${VERSION}-${target#binary-}"
            mkdir -p "${RUNNER_TEMP}/${name}"
            install -m 755 "${binary}" "${RUNNER_TEMP}/${name}/enroute"
            cp LICENSE NOTICE "${RUNNER_TEMP}/${name}/"
            tar -C "${RUNNER_TEMP}" -czf "${RUNNER_TEMP}/dist/${name}.tar.gz" "${name}"
          done

      - name: Sum the archives
        working-directory: ${{ runner.temp }}/dist
        run: sha256sum -- *.tar.gz >SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: enroute-${{ needs.version.outputs.version }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
