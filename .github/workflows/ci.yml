name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Every step below names checks rather than commands: `cargo xtask ci <checks>`
# is the same program a laptop runs, so this file and that one cannot drift.
# `cargo xtask ci verify-workflow` fails when a check stops being named here.
jobs:
  # Everything that needs no Rust build: the pinned checkers, the guard on this
  # file, the shell checks, and the summary of what the run proved.
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      # Pinned versions from dev/xtask/src/ci/tools.rs, installed under
      # `target/tools`, which the other jobs download.
      - run: cargo xtask ci tools

      - run: cargo xtask ci shell

      - run: cargo xtask ci verify-workflow

      # What a green run means, in the run itself, so the next reader does not
      # have to open the workflow to find out what was checked.
      - run: cargo xtask ci list --markdown >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: checkers
          path: target/tools
          if-no-files-found: error
          retention-days: 1

  lint:
    needs: [pipeline]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - uses: actions/download-artifact@v8
        with:
          name: checkers
          path: target/tools

      - run: cargo xtask ci fmt clippy lint

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - run: cargo xtask ci unit doc

  # In its own job because it is the long pole: a unit-test failure arrives
  # while this one is still linking, instead of after it.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - run: cargo xtask ci e2e
