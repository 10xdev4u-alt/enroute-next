// Between ledger nodes: the Raft traffic of every log, batched per peer
// (as TiKV batches its Raft messages).

syntax = "proto3";

package enroute.internal.raft.v1;

import "state.proto";

service Raft {
  // A batch of frames for many logs; delivered to the engine in order.
  rpc Deliver(Frames) returns (Delivered);
}

message Frames {
  repeated Frame frames = 1;
}

message Frame {
  // The log (an incarnation of a repository's log) the frame is for.
  uint64 log = 1;
  oneof kind {
    // A raft-rs message (eraftpb.Message), encoded by raft-rs.
    bytes raft = 2;
    // Wake a quiet log: its leader resumes and reveals itself.
    Wake wake = 3;
    // An incarnation is hosted (announced by its leader): host it too.
    Host host = 4;
  }
}

message Wake {}

message Host {
  string repo = 1;
  uint64 epoch = 2;
  // Its initial state when it was just created; otherwise the receiver
  // reads it from the object store.
  enroute.internal.v1.Record state = 3;
}

message Delivered {}
